# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_mettle_attribute"
description = "bevy_mettle's attributes: marker types with their rules derived, a base and a current value each on the actor, modifiers folded over them"
keywords = ["bevy", "attributes", "modifiers", "game"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }

[dependencies]
# Tags, curves and the condition language
bevy_mettle_core = { workspace = true, features = [] }

# The Attribute derive
bevy_mettle_macros = { workspace = true, features = [] }

# Game engine
bevy = { workspace = true, features = ["bevy_log", "serialize"] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }


[lints]
workspace = true
