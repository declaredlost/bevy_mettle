# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_mettle_attribute"
description = "bevy_mettle's attributes: marker types with their rules derived, a base and a current value each on the actor, modifiers folded over them"
readme = "./README.md"
keywords = ["bevy", "attributes", "modifiers", "game"]
categories = ["game-development"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Tags, curves and the condition language
bevy_mettle_core = { workspace = true, features = [] }

# The Attribute derive
bevy_mettle_macros = { workspace = true, features = [] }

# Game engine
bevy = { workspace = true, features = ["bevy_log", "serialize"] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }


[lints]
workspace = true
