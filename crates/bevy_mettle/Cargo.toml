# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_mettle"
description = "A gameplay framework for Bevy in the spirit of Unreal's Gameplay Ability System: attributes, effects and abilities, its crates behind features"
readme = "./README.md"
keywords = ["bevy", "gameplay", "attributes", "abilities"]
categories = ["game-development"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["attribute", "effect", "ability"]
# Attributes: `bevy_mettle_attribute`, as `bevy_mettle::attribute`
attribute = ["dep:bevy_mettle_attribute"]
# Effects: `bevy_mettle_effect`, as `bevy_mettle::effect`
effect = ["attribute", "dep:bevy_mettle_effect"]
# Abilities: `bevy_mettle_ability`, as `bevy_mettle::ability`
ability = ["effect", "dep:bevy_mettle_ability"]
# Prediction over lightyear: `bevy_mettle_lightyear`, as
# `bevy_mettle::lightyear`
lightyear = ["ability", "dep:bevy_mettle_lightyear"]

[dependencies]
# Gameplay tags, curves and conditions: always there
bevy_mettle_core = { workspace = true, features = [] }

# The parts, each behind its feature
bevy_mettle_attribute = { workspace = true, features = [], optional = true }
bevy_mettle_effect = { workspace = true, features = [], optional = true }
bevy_mettle_ability = { workspace = true, features = [], optional = true }
bevy_mettle_lightyear = { workspace = true, features = [], optional = true }

# Game engine: the plugin group, and logging content rejected
bevy = { workspace = true, features = ["bevy_log"] }

# (De)serialization: the content a game hands over
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# Testing the plugin in a real app
bevy_harness = { workspace = true, features = [] }

# Checking what data reads and writes, whatever its format
serde_test = { workspace = true, features = [] }

# A server and a client, to add the plugins after lightyear's
lightyear = { workspace = true, features = ["client", "server", "replication"] }
bevy = { workspace = true, features = ["bevy_state"] }

# Benchmarks
criterion = { workspace = true, features = [] }

# What the derives reject, as it fails to compile
trybuild = { workspace = true, features = [] }

[[bench]]
name = "mettle"
harness = false
required-features = ["effect"]

[lints]
workspace = true
