# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_mettle_core"
description = "What bevy_mettle's crates share: gameplay tags and the tags an actor owns, curve tables, and the condition language"
readme = "./README.md"
keywords = ["bevy", "gameplay", "tags", "game"]
categories = ["game-development"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# The Id derive
bevy_mettle_macros = { workspace = true, features = [] }

# Owned tags: a component, the events of its changes, and the system
# telling them
bevy_ecs = { workspace = true, features = ["bevy_reflect"] }

# Reflection: for inspectors, scenes and remote access
bevy_reflect = { workspace = true, features = [] }

# Curves: what curve tables sample
bevy_curve = { workspace = true, features = ["serialize"] }

# (De)serialization
serde = { workspace = true, features = ["derive"] }

# Derive macros & utilities
thiserror = { workspace = true, features = [] }

# Hashing
fnv = { workspace = true, features = [] }

# Primitive datatypes
smol_str = { workspace = true, features = ["serde"] }

[dev-dependencies]
# Definitions
ron = { workspace = true, features = [] }

[lints]
workspace = true
