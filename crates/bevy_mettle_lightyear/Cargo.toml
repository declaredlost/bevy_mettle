# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_mettle_lightyear"
description = "bevy_mettle over lightyear: its replicas and bases replicated, ability requests and replies sent, and who may ask checked"
readme = "./README.md"
keywords = ["bevy", "lightyear", "multiplayer", "gameplay"]
categories = ["game-development"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# What's replicated and sent
bevy_mettle_attribute = { workspace = true, features = [] }
bevy_mettle_effect = { workspace = true, features = [] }
bevy_mettle_ability = { workspace = true, features = [] }

# Game engine
bevy = { workspace = true, features = [] }

# Networking
lightyear = { workspace = true, features = ["client", "server", "replication"] }

# Replication's ticks: what a reply waits for the state of
bevy_replicon = { workspace = true, features = ["client", "server"] }

# (De)serialization of a reply as it's sent
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
# States, which lightyear's plugins need
bevy = { workspace = true, features = ["bevy_state"] }

# An in-process client and server for the tests
lightyear = { workspace = true, features = ["client", "server", "replication", "crossbeam", "netcode"] }
bevy_mettle_core = { workspace = true, features = [] }

# Driving the client and server as apps under test
bevy_harness = { workspace = true, features = [] }

[lints]
workspace = true
