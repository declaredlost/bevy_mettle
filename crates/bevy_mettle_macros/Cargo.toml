# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_mettle_macros"
description = "bevy_mettle's derives: what ids name, attributes, meta attributes and behaviours"
readme = "./README.md"
keywords = ["bevy", "attributes", "macro"]
categories = ["game-development"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }
documentation = { workspace = true }

[lib]
proc-macro = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Finding the crate the derive names
proc-macro-crate = { workspace = true, features = [] }

# Parsing and quoting
proc-macro2 = { workspace = true, features = [] }
quote = { workspace = true, features = [] }
syn = { workspace = true, features = ["full"] }

[lints]
workspace = true
