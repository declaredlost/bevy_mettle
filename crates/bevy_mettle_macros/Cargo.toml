# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_mettle_macros"
description = "bevy_mettle's derives: what ids name, and attributes"
keywords = ["bevy", "attributes", "macro"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }

[lib]
proc-macro = true

[dependencies]
# Finding the crate the derive names
proc-macro-crate = { workspace = true, features = [] }

# Parsing and quoting
proc-macro2 = { workspace = true, features = [] }
quote = { workspace = true, features = [] }
syn = { workspace = true, features = ["full"] }

[lints]
workspace = true
