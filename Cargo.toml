# https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = [
    "./crates/bevy_mettle",
    "./crates/bevy_mettle_ability",
    "./crates/bevy_mettle_attribute",
    "./crates/bevy_mettle_core",
    "./crates/bevy_mettle_effect",
    "./crates/bevy_mettle_lightyear",
    "./crates/bevy_mettle_macros",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.99"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

authors = ["Oleh Martsokha <o.martsokha@gmail.com>"]
repository = "https://github.com/declaredlost/bevy_mettle"
documentation = "https://docs.rs/bevy_mettle"

# Shared lints for every crate (opt in with `[lints] workspace = true`).
# The whole of `clippy::pedantic` is denied.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Lint exceptions are `#[expect]`s with a reason, so stale ones are reported.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Bevy systems take `Res`, `Query` and `Commands` by value by design.
needless_pass_by_value = "allow"
# Bevy systems naturally have many resource params and complex `Query`
# types: these lints fire on idiomatic Bevy code, so they're allowed
# workspace-wide rather than per system.
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
# Default features are disabled for certain dependencies to allow
# downstream workspaces/crates to selectively enable them as needed.
#
# See for more details: https://github.com/rust-lang/cargo/issues/11329

# Internal crates
bevy_mettle_ability = { path = "./crates/bevy_mettle_ability", version = "0.1.0" }
bevy_mettle_attribute = { path = "./crates/bevy_mettle_attribute", version = "0.1.0" }
bevy_mettle_core = { path = "./crates/bevy_mettle_core", version = "0.1.0" }
bevy_mettle_effect = { path = "./crates/bevy_mettle_effect", version = "0.1.0" }
bevy_mettle_lightyear = { path = "./crates/bevy_mettle_lightyear", version = "0.1.0" }
bevy_mettle_macros = { path = "./crates/bevy_mettle_macros", version = "0.1.0" }

# Game engine (headless by default)
bevy = { version = "0.20", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
bevy_app = { version = "0.20", default-features = false, features = ["std"] }
bevy_curve = { version = "0.20", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.20", default-features = false, features = ["std"] }
bevy_platform = { version = "0.20", default-features = false, features = ["std"] }

# Networking
lightyear = { version = "0.31", default-features = false, features = ["std"] }
bevy_replicon = { version = "0.45", default-features = false, features = [] }

# Testing
bevy_harness = { git = "https://github.com/declaredlost/bevy_harness", version = "0.1.0" }
criterion = { version = "0.8", default-features = false, features = [] }
trybuild = { version = "1.0", features = [] }

# (De)serialization
serde = { version = "1.0", features = [] }
serde_test = { version = "1.0", features = [] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }

# Derive macros & utilities
thiserror = { version = "2.0", features = [] }

# Hashing
fnv = { version = "1.0", features = [] }

# Primitive datatypes
smol_str = { version = "0.3", features = [] }

# Proc macros
proc-macro-crate = { version = "3.5", features = [] }
proc-macro2 = { version = "1.0", features = [] }
quote = { version = "1.0", features = [] }
syn = { version = "3.0", features = [] }

# Development: compile our code with light optimizations for fast iteration,
# and dependencies (Bevy) fully optimized so tests run quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
